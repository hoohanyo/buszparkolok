<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buszparkolók</title>
<meta name="theme-color" content="#2A1638">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Buszparkolók">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
<script src="web-bridge.js?v=1.3.2"></script>
<script id="bpTemaInit">try{document.documentElement.setAttribute("data-tema",localStorage.getItem("bpTema")==="sotet"?"sotet":"vilagos")}catch(e){document.documentElement.setAttribute("data-tema","vilagos")}</script>
<style>
  /* ===== Téma: világos / sötét (mint a Flottakezelő) ===== */
  :root,html[data-tema="vilagos"]{color-scheme:light;
    --bg:#F8F0F3;--pageG:linear-gradient(165deg,#F6E3EE 0%,#EADCF1 33%,#F7DCE5 64%,#FCDDC9 100%);
    --card:#FFFFFF;--card2:#FBF6F8;--line:#EEDFE6;--line2:#F4EAEF;
    --ink:#24152B;--muted:#6E5C72;--faint:#9A889D;--soft:#45324B;
    --acc:#B8365A;--acc2:#D04A55;--accS:#FCE8EE;--accT:#982A4A;
    --ok:#1F9D5A;--okS:#E5F5EC;--okT:#13703F;--warn:#C2410C;--warnS:#FFF4DE;--bad:#D9363E;--badS:#FDEDEC;--badT:#B42318;
    --teal:#0E9F8E;--grape:#6D3FD1;--grapeS:#F1ECFD;
    --shadow:0 1px 2px rgba(60,20,50,.05),0 6px 18px rgba(60,20,50,.07);--shadowH:0 2px 4px rgba(60,20,50,.06),0 14px 30px rgba(90,30,60,.14);
    --hero:linear-gradient(120deg,#2A1638 0%,#5E2352 40%,#B83B5E 72%,#E5704A 100%);--heroSh:0 10px 28px rgba(60,20,50,.3);
    --glass:rgba(255,255,255,.16);--glassB:rgba(255,255,255,.28);--plateBg:#fff;--plateInk:#24152B;
    --toastBg:#2A1638;--toastT:#fff;--mapBg:#EFE6EC;--btnG:linear-gradient(135deg,#7A2756,#E0574F);--btnSh:rgba(160,50,80,.7);--edge:linear-gradient(90deg,#B8365A,#F09040);
    --lip:#E6CCDA;--hi:rgba(255,255,255,.95);--d3:0 14px 22px -14px rgba(90,30,60,.45);--btnLip:#5E1F45;}
  html[data-tema="sotet"]{color-scheme:dark;
    --bg:#140B15;--pageG:linear-gradient(165deg,#170C1C 0%,#160B1A 40%,#1A0D1A 72%,#1D0F14 100%);
    --card:#21152A;--card2:#2A1C33;--line:#3A2640;--line2:#2F1F35;
    --ink:#F3E9F1;--muted:#B8A3B9;--faint:#8D7891;--soft:#DCCADA;
    --acc:#FF7E95;--acc2:#FFA3B4;--accS:rgba(255,126,149,.14);--accT:#FFA3B4;
    --ok:#4FBF85;--okS:rgba(79,191,133,.14);--okT:#6FD49F;--warn:#F5A35E;--warnS:rgba(242,179,61,.13);--bad:#FF7A6E;--badS:rgba(255,122,110,.13);--badT:#FF9A90;
    --teal:#3CCFBE;--grape:#C9B3F0;--grapeS:rgba(190,160,230,.16);
    --shadow:0 1px 2px rgba(0,0,0,.35),0 6px 18px rgba(0,0,0,.28);--shadowH:0 2px 6px rgba(0,0,0,.4),0 16px 34px rgba(0,0,0,.5);
    --hero:linear-gradient(120deg,#170B20 0%,#3F173A 40%,#8A2C49 72%,#B4523A 100%);--heroSh:0 10px 28px rgba(0,0,0,.5);
    --glass:rgba(255,255,255,.10);--glassB:rgba(255,255,255,.18);--plateBg:#F3E9F1;--plateInk:#140B15;
    --toastBg:#3A2640;--toastT:#F3E9F1;--mapBg:#2A1C33;--btnG:linear-gradient(135deg,#6A2150,#D04A55);--btnSh:rgba(0,0,0,.5);--edge:linear-gradient(90deg,#FF7E95,#FFAE6B);
    --lip:#0E0710;--hi:rgba(255,255,255,.07);--d3:0 14px 22px -12px rgba(0,0,0,.6);--btnLip:#3A1030;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  html{transition:background-color .3s ease;}
  body{padding-bottom:40px;background:transparent;}
  html:before{content:"";position:fixed;inset:0;z-index:-1;background:var(--pageG);transition:opacity .3s;pointer-events:none;}
  h1,.gr{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}
  .ico{display:block;flex-shrink:0;}

  /* ===== Fejléc: lassan hullámzó kék színátmenet ===== */
  .top{position:sticky;top:0;z-index:20;padding:14px 16px 14px;color:#fff;background:var(--hero);background-size:220% 100%;
    border-radius:0 0 24px 24px;box-shadow:var(--heroSh);animation:bpHero 24s ease-in-out infinite alternate;}
  @keyframes bpHero{from{background-position:0% 50%}to{background-position:100% 50%}}
  .topIn{max-width:1240px;margin:0 auto;}
  .topRow{display:flex;align-items:center;gap:10px;}
  .topTitle{flex:1;min-width:0;}
  .topTitle h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:9px;}
  .topTitle h1 .logo{width:30px;height:30px;border-radius:9px;box-shadow:0 2px 8px rgba(0,0,0,.3);flex-shrink:0;}
  .topTitle p{margin:3px 0 0;font-size:13px;opacity:.85;font-weight:500;display:flex;align-items:center;flex-wrap:wrap;gap:4px 6px;}
  .ib{width:42px;height:42px;border-radius:14px;border:1px solid var(--glassB);background:var(--glass);color:#fff;padding:0;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;
    -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:transform .15s ease,background .2s;}
  .ib:hover{background:rgba(255,255,255,.24);}
  .ib:active{transform:scale(.92);}
  .ib.back{width:44px;height:44px;}
  .ib.spin .ico{animation:bpSpin .9s linear infinite;}
  .ib.done{background:rgba(79,191,133,.35);border-color:rgba(79,191,133,.6);}
  .ib.done .ico{animation:bpPop .45s cubic-bezier(.3,1.6,.5,1);}
  .ib.bump{animation:bpBump .5s cubic-bezier(.3,1.6,.5,1);}
  @keyframes bpSpin{to{transform:rotate(360deg)}}
  @keyframes bpPop{0%{transform:scale(.3);opacity:0}100%{transform:scale(1);opacity:1}}
  @keyframes bpBump{0%,100%{transform:scale(1)}40%{transform:scale(1.22)}}
  .search{margin-top:12px;display:flex;align-items:center;background:var(--card);border-radius:14px;padding:0 12px;
    box-shadow:0 4px 14px rgba(5,15,40,.18);border:1px solid transparent;transition:border-color .2s,box-shadow .2s;}
  .search:focus-within{border-color:var(--acc);box-shadow:0 0 0 3px rgba(255,126,149,.3),0 4px 14px rgba(40,10,30,.18);}
  .search .sI{color:var(--faint);display:flex;}
  .search input{flex:1;border:none;outline:none;background:transparent;padding:12px 8px;font-size:16px;color:var(--ink);min-width:0;font-family:inherit;}
  .search input::placeholder{color:var(--faint);}
  .search button{border:none;background:var(--card2);color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:1px solid var(--line);background:var(--card);color:var(--soft);border-radius:999px;padding:6px 14px 6px 8px;
    font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:7px;box-shadow:var(--shadow);
    transition:transform .15s ease,background .2s,color .2s,border-color .2s;position:relative;}
  .chip .ico{color:var(--muted);margin-left:3px;}
  .chip .tile{box-shadow:none;}
  .chip:active{transform:scale(.95);}
  .chip.on{background:var(--acc);border-color:var(--acc);color:#fff;}
  .chip.on .ico{color:#fff;}
  .chip.near.on{background:var(--teal);border-color:var(--teal);}
  .chip.near.loc .ico{color:var(--teal);}
  .chip.near.loc:after{content:"";position:absolute;left:12px;top:50%;width:14px;height:14px;margin:-7px 0 0 0;border-radius:50%;
    border:2px solid var(--teal);animation:bpRadar 1.2s ease-out infinite;pointer-events:none;}
  @keyframes bpRadar{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.6);opacity:0}}
  .status{padding:6px 18px 0;font-size:12px;color:var(--faint);font-weight:500;}
  .status.off{color:var(--warn);font-weight:600;}
  #stat,#chips,.mine{max-width:1240px;margin-left:auto;margin-right:auto;}

  /* ===== Országrács ===== */
  .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;padding:12px 16px;max-width:1240px;margin:0 auto;}
  .cty{position:relative;border:1px solid var(--line);text-align:left;border-radius:18px;padding:14px 14px 13px;min-height:116px;
    display:flex;flex-direction:column;overflow:hidden;background:var(--card);color:var(--ink);box-shadow:var(--shadow);
    transition:transform .18s ease,box-shadow .18s ease,border-color .18s;}
  .cty:before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--edge);opacity:0;transition:opacity .2s;}
  .cty:hover{transform:translateY(-2px);box-shadow:var(--shadowH);border-color:transparent;}
  .cty:hover:before{opacity:1;}
  .cty:active{transform:scale(.97);box-shadow:var(--shadow);}
  .cty .flag{font-size:34px;line-height:1;display:inline-block;transform-origin:0 50%;}
  .cty .plate{position:absolute;right:12px;top:14px;background:var(--plateBg);color:var(--plateInk);border:2px solid var(--plateInk);border-radius:50%/50%;
    min-width:42px;height:27px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12.5px;letter-spacing:.3px;}
  .cty .nm{margin-top:auto;padding-top:10px;font-size:16px;font-weight:700;color:var(--ink);line-height:1.25;font-family:"Plus Jakarta Sans",Inter,sans-serif;}
  .cty .cnt{margin-top:3px;font-size:12.5px;font-weight:600;color:var(--acc);}
  .empty{margin:34px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6;}
  .empty .eI{width:64px;height:64px;margin:0 auto 12px;border-radius:20px;background:var(--accS);color:var(--acc);display:flex;align-items:center;justify-content:center;}

  /* ===== Lista ===== */
  .list{padding:6px 16px 10px;max-width:1240px;margin:0 auto;}
  .letter{margin:18px 4px 8px;font-size:12px;font-weight:800;color:var(--acc);letter-spacing:1.2px;display:flex;align-items:center;gap:10px;}
  .letter:after{content:"";flex:1;height:1px;background:var(--line);}
  .row{width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;display:flex;
    align-items:center;gap:13px;text-align:left;color:var(--ink);box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s;}
  .row:hover{transform:translateY(-1px);box-shadow:var(--shadowH);border-color:transparent;}
  .row:active{transform:scale(.98);box-shadow:var(--shadow);}
  .tile{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 10px -4px var(--sh);}
  .tile svg{display:block;}
  .tile.flagT{width:44px;height:44px;border-radius:13px;font-size:24px;background:var(--card2);border:1px solid var(--line);box-shadow:none;}
  .row .mid{flex:1;min-width:0;}
  .row .t{font-size:15.5px;font-weight:700;line-height:1.25;}
  .row .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .ic{margin-top:5px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12.5px;}
  .row .km{font-size:12px;font-weight:700;color:var(--teal);white-space:nowrap;display:inline-flex;align-items:center;gap:3px;}
  .row .km .ico,.tag .ico{width:13px;height:13px;}
  .row .chev{color:var(--faint);display:flex;transition:transform .2s;}
  .row:hover .chev{transform:translateX(3px);}
  .fee{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:700;}
  .fee.pay{background:var(--badS);color:var(--badT);}
  .tag{font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:3px;}

  /* ===== Részletek ===== */
  .det{padding:14px 16px;max-width:760px;margin:0 auto;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:6px 16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .map{position:relative;height:240px;border-radius:18px;overflow:hidden;background:var(--mapBg);margin-bottom:14px;border:1px solid var(--line);box-shadow:var(--shadow);}
  .map iframe{border:0;width:100%;height:100%;display:block;}
  html[data-tema="sotet"] .map iframe{filter:invert(.9) hue-rotate(180deg) saturate(.8) brightness(.95);}
  html[data-tema="sotet"] .map.sat iframe{filter:none;}
  .map .noMap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:var(--muted);font-size:14px;font-weight:600;text-align:center;padding:20px;gap:10px;}
  .mapTog{position:absolute;left:10px;bottom:10px;display:flex;background:var(--card);border-radius:999px;padding:3px;box-shadow:0 2px 10px rgba(0,0,0,.2);}
  .mapTog button{border:none;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s;}
  .mapTog button.on{background:var(--acc);color:#fff;}
  .acts{display:flex;gap:10px;margin-bottom:14px;}
  .big{flex:1;border:none;border-radius:16px;padding:15px 10px;font-size:15.5px;font-weight:700;display:flex;align-items:center;
    justify-content:center;gap:9px;transition:transform .15s ease,box-shadow .2s,filter .2s;position:relative;overflow:hidden;}
  .big:active{transform:scale(.97);}
  .big.nav{background:var(--btnG);color:#fff;box-shadow:0 10px 22px -10px var(--btnSh);}
  .big.nav:hover{filter:brightness(1.07);}
  .big.open{background:var(--card);color:var(--acc);border:1px solid var(--line);box-shadow:var(--shadow);}
  .big[disabled]{opacity:.45;}
  .kv{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line2);align-items:flex-start;}
  .kv:last-child{border-bottom:none;}
  .kv .k{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accS);color:var(--acc);}
  .kv .k .tile{box-shadow:none;}
  .kv .v{flex:1;min-width:0;}
  .kv .l{font-size:11.5px;color:var(--faint);font-weight:700;text-transform:uppercase;letter-spacing:.5px;}
  .kv .x{font-size:15px;line-height:1.45;margin-top:2px;word-wrap:break-word;}
  .kv .tap{color:var(--acc);font-weight:600;cursor:pointer;}
  .cp{border:1px solid var(--line);background:var(--card2);color:var(--acc);border-radius:10px;padding:6px 11px;font-size:12.5px;font-weight:700;align-self:center;
    display:inline-flex;align-items:center;gap:5px;transition:background .2s,color .2s,border-color .2s,transform .15s;}
  .cp:active{transform:scale(.94);}
  .cp.ok{background:var(--okS);color:var(--okT);border-color:transparent;}
  .meta{font-size:12px;color:var(--faint);text-align:center;margin:6px 0 12px;}
  .ghost{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:16px;padding:13px;font-size:14.5px;font-weight:600;
    display:flex;align-items:center;justify-content:center;gap:8px;transition:border-color .2s,color .2s,transform .15s;}
  .ghost:hover{border-color:var(--acc);color:var(--acc);}
  .ghost:active{transform:scale(.98);}
  .warnBox{background:var(--badS);color:var(--badT);border-radius:16px;padding:12px 14px;margin-bottom:12px;font-size:15px;font-weight:500;display:flex;gap:10px;align-items:center;}

  /* ===== Űrlap ===== */
  .card.frm{padding:16px;}
  .frm label{display:block;font-size:11.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin:16px 0 6px;}
  .frm label:first-child{margin-top:0;}
  .frm input,.frm select,.frm textarea{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--card2);
    color:var(--ink);font-size:16px;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s;}
  .frm input:focus,.frm select:focus,.frm textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accS);}
  .frm textarea{min-height:80px;resize:vertical;}
  .hint{font-size:12.5px;color:var(--faint);margin-top:6px;line-height:1.45;}
  .hint.ok{color:var(--okT);font-weight:600;} .hint.bad{color:var(--warn);font-weight:600;}
  .inRow{display:flex;gap:8px;} .inRow input{flex:1;}
  .sm{border:1px solid transparent;border-radius:12px;padding:0 14px;font-size:14px;font-weight:600;background:var(--accS);color:var(--acc);white-space:nowrap;
    display:flex;align-items:center;gap:6px;transition:transform .15s;}
  .sm:active{transform:scale(.95);}
  .seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:3px;}
  .seg button{border:none;background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:600;color:var(--muted);transition:background .2s,color .2s;}
  .seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .seg button.on.y{background:var(--acc);color:#fff;}
  .send{width:100%;border:none;border-radius:16px;padding:16px;font-size:16.5px;font-weight:700;color:#fff;margin-top:6px;
    background:var(--btnG);box-shadow:0 12px 24px -12px var(--btnSh);transition:transform .15s,filter .2s;}
  .send:hover{filter:brightness(1.07);}
  .send:active{transform:scale(.98);}
  .send[disabled]{opacity:.55;}
  .err{color:var(--bad);font-size:14px;font-weight:600;margin:10px 2px 0;}
  .seg.wide{display:flex;flex-wrap:wrap;border-radius:16px;}
  .seg.wide button{flex:1 1 auto;padding:7px 10px 7px 7px;border-radius:13px;display:flex;align-items:center;gap:7px;justify-content:center;}
  .seg.wide button .tile{box-shadow:none;}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--toastBg);color:var(--toastT);
    padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .25s cubic-bezier(.2,.9,.3,1.2);z-index:99;
    max-width:88%;text-align:center;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading{display:flex;flex-direction:column;align-items:center;margin:48px 0 10px;gap:16px;}
  .loading img{width:72px;height:72px;border-radius:20px;box-shadow:0 10px 26px rgba(60,20,50,.3);animation:bpBreath 2.2s ease-in-out infinite;}
  .loading .d{display:flex;gap:7px;}
  .loading .d i{width:8px;height:8px;border-radius:50%;background:var(--acc);opacity:.25;animation:bpDot 1s infinite ease-in-out;}
  .loading .d i:nth-child(2){animation-delay:.15s;} .loading .d i:nth-child(3){animation-delay:.3s;}
  @keyframes bpDot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  @keyframes bpBreath{0%,100%{transform:scale(1);box-shadow:0 10px 26px rgba(60,20,50,.3)}50%{transform:scale(1.06);box-shadow:0 14px 34px rgba(184,54,90,.45)}}
  .row.closed{opacity:.6;} .row.closed .t{text-decoration:line-through;}
  .pend{border:none;background:#fff;color:var(--warn);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;gap:4px;}
  .mine{margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-size:13px;color:var(--muted);
    font-weight:500;box-shadow:var(--shadow);}
  .mine .mt{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:3px;}
  .mine b{font-size:15px;font-weight:800;} .mine b.w{color:var(--warn);} .mine b.o{color:var(--okT);} .mine b.n{color:var(--badT);}
  .mine i{font-style:normal;margin:0 7px;color:var(--line);}


  /* ===== 3D: felső fényél, alsó „perem”, megnyomva lesüllyed ===== */
  .cty,.row,.card,.map,.mine,.chip,.big.open,.cp,.ghost{border-color:var(--line);}
  .cty{box-shadow:inset 0 1px 0 var(--hi),0 4px 0 var(--lip),var(--d3);background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);margin-bottom:4px;}
  .cty:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--hi),0 6px 0 var(--lip),0 20px 28px -14px rgba(90,30,60,.5);border-color:var(--line);}
  .cty:active{transform:translateY(3px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--lip),0 4px 8px -6px rgba(90,30,60,.4);}
  .row{box-shadow:inset 0 1px 0 var(--hi),0 3px 0 var(--lip),var(--d3);background:linear-gradient(180deg,var(--card) 0%,var(--card2) 100%);}
  .row:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--hi),0 4px 0 var(--lip),0 18px 26px -14px rgba(90,30,60,.5);border-color:var(--line);}
  .row:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--lip),0 4px 8px -6px rgba(90,30,60,.4);}
  .card,.mine{box-shadow:inset 0 1px 0 var(--hi),0 4px 0 var(--lip),var(--d3);}
  .map{box-shadow:0 4px 0 var(--lip),var(--d3);border:3px solid var(--card);}
  .chip{box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--lip),0 6px 10px -6px rgba(90,30,60,.35);}
  .chip:active{transform:translateY(2px);box-shadow:inset 0 1px 0 var(--hi),0 0 0 var(--lip);}
  .chip.on{box-shadow:0 2px 0 var(--btnLip),0 6px 10px -6px rgba(90,30,60,.45);}
  .chip.near.on{box-shadow:0 2px 0 #0A6F63,0 6px 10px -6px rgba(10,120,100,.45);}
  .big.nav,.send{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 0 var(--btnLip),0 14px 22px -10px var(--btnSh);}
  .big.nav:active,.send:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 var(--btnLip),0 4px 8px -6px var(--btnSh);}
  .big.open{box-shadow:inset 0 1px 0 var(--hi),0 4px 0 var(--lip),var(--d3);}
  .big.open:active{transform:translateY(3px);box-shadow:inset 0 1px 0 var(--hi),0 1px 0 var(--lip);}
  .cp{box-shadow:0 2px 0 var(--lip);}
  .cp:active{transform:translateY(2px);box-shadow:none;}
  .tile{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.14),0 5px 10px -3px var(--sh);}
  .tile.flagT{box-shadow:inset 0 1px 0 var(--hi),0 2px 0 var(--lip);}
  .kv .k{box-shadow:inset 0 -2px 0 rgba(0,0,0,.06);}
  .ib{box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 3px 0 rgba(0,0,0,.22),0 8px 14px -6px rgba(0,0,0,.35);}
  .ib:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 1px 0 rgba(0,0,0,.22);}
  .search{box-shadow:inset 0 2px 3px rgba(0,0,0,.06),0 3px 0 rgba(0,0,0,.18),0 10px 18px -8px rgba(30,5,25,.4);}

  /* ===== Mozgás ===== */
  .in{animation:bpIn .42s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0) * 35ms);}
  @keyframes bpIn{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
  .cty.in .flag{animation:bpWave 1.1s ease-in-out both;animation-delay:calc(var(--i,0) * 35ms + .25s);}
  @keyframes bpWave{0%,100%{transform:none}20%{transform:skewY(-5deg) scaleX(.96)}45%{transform:skewY(4deg) scaleX(.98)}70%{transform:skewY(-2deg)}}
  #body.fwd{animation:bpFwd .32s cubic-bezier(.2,.8,.25,1) both;}
  #body.bwd{animation:bpBwd .32s cubic-bezier(.2,.8,.25,1) both;}
  @keyframes bpFwd{from{opacity:0;transform:translateX(36px)}to{opacity:1;transform:none}}
  @keyframes bpBwd{from{opacity:0;transform:translateX(-36px)}to{opacity:1;transform:none}}
  .fly{position:fixed;z-index:200;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 6px rgba(184,54,90,.22);pointer-events:none;
    transition:transform .65s cubic-bezier(.5,-0.3,.6,1),opacity .65s ease;}
  @media (min-width:900px){
    .grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .list{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:12px;align-items:stretch;}
    .list>*{grid-column:1/-1;}
    .list>.row{grid-column:auto;margin-bottom:12px;height:calc(100% - 12px);}
  }
  @media (prefers-reduced-motion:reduce){
    *,*:before,*:after{animation:none !important;transition:none !important;}
  }
</style>
</head>
