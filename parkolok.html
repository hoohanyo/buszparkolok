<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buszparkolók</title>
<meta name="theme-color" content="#FF6B5A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Buszparkolók">
<style>
  :root{--bg:#FFF6E9;--card:#FFFFFF;--ink:#2B2140;--muted:#6E6585;--faint:#A49CB5;--line:#F0E2CF;--sun:#FFC23D;
    --coral:#FF6B5A;--pink:#FF5A7A;--teal:#13B5A6;--sky:#2F6BFF;--grape:#8A5CFF;--warn:#D9480F;--okc:#118A5B;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Arial,sans-serif;}
  body{padding-bottom:40px;}
  button{font-family:inherit;cursor:pointer;}
  .hidden{display:none !important;}

  /* Fejléc */
  .top{position:sticky;top:0;z-index:20;padding:14px 16px 12px;color:#fff;
    background:linear-gradient(120deg,#FF6B5A 0%,#FF8A3D 55%,#FFB020 100%);border-radius:0 0 26px 26px;
    box-shadow:0 8px 20px rgba(255,107,90,.25);}
  .topRow{display:flex;align-items:center;gap:10px;}
  .topTitle{flex:1;min-width:0;}
  .topTitle h1{margin:0;font-size:22px;font-weight:900;letter-spacing:-.2px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .topTitle p{margin:2px 0 0;font-size:13px;opacity:.92;font-weight:600;}
  .ico{display:block;flex-shrink:0;}
  .ib{width:44px;height:44px;border-radius:50%;border:none;background:#fff;color:#F0603F;padding:0;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    box-shadow:inset 0 -2px 0 rgba(200,80,30,.12),0 3px 0 rgba(170,60,20,.28),0 8px 14px -4px rgba(150,50,10,.35);transition:transform .08s,box-shadow .08s;}
  .ib:active{transform:translateY(2px);box-shadow:inset 0 -1px 0 rgba(200,80,30,.12),0 1px 0 rgba(170,60,20,.28),0 3px 6px -3px rgba(150,50,10,.35);}
  .ib.back{width:46px;height:46px;color:#E5503F;}
  .ib.spin .ico{animation:bpSpin .9s linear infinite;}
  @keyframes bpSpin{to{transform:rotate(360deg)}}
  .search{margin-top:12px;display:flex;align-items:center;background:#fff;border-radius:16px;padding:0 12px;
    box-shadow:0 4px 12px rgba(120,40,0,.12);}
  .search .sI{color:var(--faint);display:flex;}
  .search input{flex:1;border:none;outline:none;background:transparent;padding:13px 8px;font-size:16px;color:var(--ink);min-width:0;}
  .search button{border:none;background:#F3ECE2;color:var(--muted);width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0;}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 4px;scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:none;background:#fff;color:var(--ink);border-radius:999px;padding:6px 14px 6px 8px;
    font-size:14px;font-weight:700;white-space:nowrap;display:flex;align-items:center;gap:7px;
    box-shadow:inset 0 0 0 1.5px var(--line),0 2px 0 #EAD9C1,0 6px 10px -6px rgba(110,70,20,.35);transition:transform .08s;}
  .chip .ico{color:var(--muted);margin-left:3px;}
  .chip .tile{box-shadow:none;}
  .chip:active{transform:translateY(1px);}
  .chip.on{background:var(--ink);color:#fff;box-shadow:0 2px 0 #140E22,0 6px 10px -6px rgba(20,10,40,.5);}
  .chip.on .ico{color:#fff;}
  .chip.near.on{background:var(--teal);box-shadow:0 2px 0 #0B8577,0 6px 10px -6px rgba(10,120,100,.5);}
  .status{padding:6px 18px 0;font-size:12px;color:var(--faint);font-weight:600;}
  .status.off{color:var(--warn);}

  /* Országrács */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px 16px;}
  .cty{position:relative;border:none;text-align:left;border-radius:22px;padding:14px 14px 12px;min-height:118px;
    display:flex;flex-direction:column;overflow:hidden;
    background:linear-gradient(180deg,rgba(255,255,255,.7) 0%,rgba(255,255,255,0) 55%),var(--bgc);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 4px 0 var(--lip),0 14px 20px -12px rgba(110,70,20,.45);
    transition:transform .08s,box-shadow .08s;margin-bottom:4px;}
  .cty:active{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.9),0 1px 0 var(--lip),0 4px 8px -6px rgba(110,70,20,.45);}
  .cty .flag{font-size:38px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
  .cty .plate{position:absolute;right:12px;top:14px;background:#fff;color:#111;border:2px solid #111;border-radius:50%/50%;
    min-width:42px;height:28px;padding:0 7px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;letter-spacing:.3px;}
  .cty .nm{margin-top:auto;padding-top:10px;font-size:16px;font-weight:800;color:var(--ink);line-height:1.2;}
  .cty .cnt{margin-top:4px;font-size:12px;font-weight:800;}
  .empty{margin:30px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.6;}
  .empty b{display:block;font-size:40px;margin-bottom:6px;}

  /* Lista */
  .list{padding:6px 16px 10px;}
  .letter{margin:16px 4px 6px;font-size:13px;font-weight:900;color:var(--coral);letter-spacing:1px;}
  .row{width:100%;border:none;background:linear-gradient(180deg,#fff 0%,#FFFCF8 100%);border-radius:18px;padding:12px 14px;margin-bottom:11px;display:flex;
    align-items:center;gap:13px;text-align:left;color:var(--ink);
    box-shadow:inset 0 1px 0 #fff,0 3px 0 #EEDFCA,0 12px 18px -12px rgba(110,70,20,.45);transition:transform .08s,box-shadow .08s;}
  .row:active{transform:translateY(2px);box-shadow:inset 0 1px 0 #fff,0 1px 0 #EEDFCA,0 4px 8px -6px rgba(110,70,20,.45);}
  .tile{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.4),inset 0 -3px 0 rgba(0,0,0,.14),0 5px 10px -3px var(--sh);}
  .tile svg{display:block;}
  .tile.flagT{width:44px;height:44px;border-radius:14px;font-size:24px;}
  .row .mid{flex:1;min-width:0;}
  .row .t{font-size:16px;font-weight:800;line-height:1.25;}
  .row .s{font-size:13px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .ic{margin-top:5px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13px;}
  .row .km{font-size:12px;font-weight:800;color:var(--teal);white-space:nowrap;}
  .row .chev{color:#D2C6B6;font-size:26px;font-weight:300;}
  .fee{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:800;}
  .fee.free{background:#DDF7F3;color:#0B6E64;} .fee.pay{background:#FFE3DE;color:#B4321F;}

  /* Részletek */
  .det{padding:14px 16px;}
  .card{background:linear-gradient(180deg,#fff 0%,#FFFCF8 100%);border-radius:22px;padding:16px;margin-bottom:14px;
    box-shadow:inset 0 1px 0 #fff,0 4px 0 #EEDFCA,0 16px 22px -14px rgba(110,70,20,.45);}
  .map{position:relative;height:230px;border-radius:22px;overflow:hidden;background:#DDEFFF;margin-bottom:14px;
    border:3px solid #fff;box-shadow:0 4px 0 #EEDFCA,0 16px 22px -14px rgba(110,70,20,.45);}
  .map iframe{border:0;width:100%;height:100%;display:block;}
  .map .noMap{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    color:#3D6A9E;font-size:14px;font-weight:700;text-align:center;padding:20px;}
  .map .noMap b{font-size:36px;margin-bottom:6px;}
  .mapTog{position:absolute;left:10px;bottom:10px;display:flex;background:#fff;border-radius:999px;padding:3px;
    box-shadow:0 2px 8px rgba(0,0,0,.18);}
  .mapTog button{border:none;background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;font-weight:800;color:var(--muted);}
  .mapTog button.on{background:var(--ink);color:#fff;}
  .acts{display:flex;gap:10px;margin-bottom:12px;}
  .big{flex:1;border:none;border-radius:18px;padding:15px 10px;font-size:16px;font-weight:900;display:flex;align-items:center;
    justify-content:center;gap:8px;transition:transform .08s,box-shadow .08s;}
  .big:active{transform:translateY(3px);}
  .big.nav{background:linear-gradient(180deg,#2ED8A0,var(--teal));color:#fff;
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 4px 0 #0B8577,0 14px 20px -10px rgba(19,181,166,.6);}
  .big.nav:active{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 1px 0 #0B8577,0 4px 8px -6px rgba(19,181,166,.6);}
  .big.open{background:linear-gradient(180deg,#fff,#F3F7FF);color:var(--sky);
    box-shadow:inset 0 0 0 2px #D5E3FF,0 4px 0 #C2D5FA,0 14px 20px -12px rgba(47,107,255,.4);}
  .big.open:active{box-shadow:inset 0 0 0 2px #D5E3FF,0 1px 0 #C2D5FA;}
  .big[disabled]{opacity:.45;}
  .kv{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid #F5EDE2;align-items:flex-start;}
  .kv:last-child{border-bottom:none;}
  .kv .k{width:30px;font-size:19px;flex-shrink:0;text-align:center;display:flex;justify-content:center;}
  .kv .v{flex:1;min-width:0;}
  .kv .l{font-size:12px;color:var(--faint);font-weight:800;text-transform:uppercase;letter-spacing:.4px;}
  .kv .x{font-size:15px;line-height:1.45;margin-top:2px;word-wrap:break-word;}
  .kv .tap{color:var(--sky);font-weight:700;}
  .cp{border:none;background:#F3ECFF;color:var(--grape);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:800;align-self:center;}
  .am{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
  .amT{border-radius:16px;padding:10px 4px;text-align:center;font-size:11px;font-weight:800;}
  .amT b{display:block;font-size:22px;margin-bottom:4px;}
  .amT.yes{background:#DDF7F3;color:#0B6E64;} .amT.no{background:#F4F1F6;color:#A49CB5;}
  .amT.no b{filter:grayscale(1);opacity:.45;} .amT.unk{background:#FFF8E6;color:#B7892A;}
  .meta{font-size:12px;color:var(--faint);text-align:center;margin:6px 0 12px;}
  .ghost{width:100%;border:2px dashed #E7D6BE;background:transparent;color:var(--muted);border-radius:18px;padding:13px;font-size:15px;font-weight:800;}

  /* Űrlap */
  .frm label{display:block;font-size:12px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin:14px 0 6px;}
  .frm label:first-child{margin-top:0;}
  .frm input,.frm select,.frm textarea{width:100%;padding:12px 13px;border-radius:14px;border:2px solid var(--line);background:#FFFCF7;
    color:var(--ink);font-size:16px;outline:none;font-family:inherit;}
  .frm input:focus,.frm select:focus,.frm textarea:focus{border-color:var(--sun);}
  .frm textarea{min-height:80px;resize:vertical;}
  .hint{font-size:12px;color:var(--faint);margin-top:6px;line-height:1.45;}
  .hint.ok{color:var(--okc);font-weight:700;} .hint.bad{color:var(--warn);font-weight:700;}
  .inRow{display:flex;gap:8px;} .inRow input{flex:1;}
  .sm{border:none;border-radius:14px;padding:0 14px;font-size:14px;font-weight:800;background:#E1EBFF;color:var(--sky);white-space:nowrap;
    display:flex;align-items:center;gap:6px;box-shadow:0 3px 0 #C2D5FA;}
  .sm:active{transform:translateY(2px);box-shadow:0 1px 0 #C2D5FA;}
  .tri{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:6px 0;}
  .tri .n{font-size:15px;font-weight:700;}
  .seg{display:flex;background:#F4EEE6;border-radius:999px;padding:3px;}
  .seg button{border:none;background:transparent;border-radius:999px;padding:6px 11px;font-size:13px;font-weight:800;color:var(--muted);}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
  .seg button.on.y{background:var(--teal);color:#fff;} .seg button.on.nn{background:#B9B2C6;color:#fff;}
  .quick{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
  .quick button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink);}
  .send{width:100%;border:none;border-radius:999px;padding:16px;font-size:17px;font-weight:900;color:#fff;margin-top:6px;
    background:linear-gradient(180deg,#FF7E6A,var(--pink));
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 4px 0 #CF3A5C,0 14px 20px -10px rgba(255,90,122,.55);transition:transform .08s;}
  .send:active{transform:translateY(3px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.35),0 1px 0 #CF3A5C;}
  .send[disabled]{opacity:.55;}
  .err{color:var(--warn);font-size:14px;font-weight:700;margin:10px 2px 0;}

  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:11px 18px;border-radius:999px;font-size:14px;font-weight:700;opacity:0;transition:all .2s ease;z-index:99;
    max-width:88%;text-align:center;pointer-events:none;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
  .loading{display:flex;gap:7px;justify-content:center;margin:40px 0;}
  .loading i{width:10px;height:10px;border-radius:50%;opacity:.25;animation:bpDot 1s infinite ease-in-out;}
  .loading i:nth-child(1){background:var(--coral);} .loading i:nth-child(2){background:var(--sun);animation-delay:.15s;}
  .loading i:nth-child(3){background:var(--teal);animation-delay:.3s;}
  @keyframes bpDot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1.1)}}
  .tag{font-size:12px;font-weight:800;color:var(--muted);}
  .row.closed{opacity:.6;} .row.closed .t{text-decoration:line-through;}
  .pend{border:none;margin-left:8px;background:#fff;color:#C2410C;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:900;
    vertical-align:1px;box-shadow:0 2px 0 rgba(150,50,10,.3);}
  .mine{margin:12px 16px 0;background:linear-gradient(180deg,#fff,#FFFCF8);border-radius:16px;padding:10px 14px;font-size:13px;color:var(--muted);
    font-weight:600;box-shadow:inset 0 1px 0 #fff,0 3px 0 #EEDFCA,0 10px 16px -12px rgba(110,70,20,.4);}
  .mine .mt{display:block;font-size:11px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:var(--faint);margin-bottom:3px;}
  .mine b{font-size:15px;font-weight:900;} .mine b.w{color:#C2410C;} .mine b.o{color:var(--okc);} .mine b.n{color:#B4321F;}
  .mine i{font-style:normal;margin:0 7px;color:#D9CBB8;}
  .warnBox{background:#FFE3DE;color:#B4321F;border-radius:18px;padding:12px 14px;margin-bottom:12px;font-size:15px;font-weight:600;}
  .seg.wide{display:flex;flex-wrap:wrap;border-radius:16px;}
  .seg.wide button{flex:1 1 auto;padding:7px 10px 7px 7px;border-radius:13px;display:flex;align-items:center;gap:7px;justify-content:center;}
  .seg.wide button .tile{box-shadow:none;}
  .ghost{transition:transform .08s;} .ghost:active{transform:translateY(2px);}
</style>
</head>

<div id="app"><div class="loading"><i></i><i></i><i></i></div></div>
<div id="toast"></div>
