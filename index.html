<style>
  :root,html[data-tema="vilagos"]{color-scheme:light;--bg:#F8F0F3;--pageG:linear-gradient(180deg,#F8F0F3 0%,#F8F0F3 42%,#EEDDF0 68%,#FCDCC8 100%);

    --acc:#B8365A;--accS:#FCE8EE;--accT:#982A4A;--warn:#C2410C;--warnS:#FFF4DE;--warnB:#F5D59A;--heroFade:248,240,243;--heroInk:#24152B;--kick:#B8365A;
    --shadow:0 1px 2px rgba(60,20,50,.05),0 6px 18px rgba(60,20,50,.08);--btnG:linear-gradient(135deg,#7A2756,#E0574F);--btnSh:rgba(160,50,80,.7);
    --titleG:linear-gradient(90deg,#8E2F5A,#D04A55 50%,#EE8140);--btnLip:#5E1F45;--lip:#E6CCDA;--hi:rgba(255,255,255,.95);--goG:linear-gradient(135deg,#2A1638,#5E2352 50%,#C2415A 85%,#E5704A);}
  html[data-tema="sotet"]{color-scheme:dark;--bg:#2C1631;--pageG:linear-gradient(180deg,#2C1631 0%,#2C1631 42%,#3E1C40 68%,#58283A 100%);
    --card:#1D1022;--card2:#170C1B;--ink:#F3E9F1;--muted:#B8A3B9;--line:#3A2640;
    --acc:#FF7E95;--accS:rgba(255,126,149,.14);--accT:#FFA3B4;--warn:#F5A35E;--warnS:rgba(242,179,61,.12);--warnB:rgba(242,179,61,.4);--heroFade:44,22,49;--heroInk:#F3E9F1;--kick:#FF8FA3;
    --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 22px rgba(0,0,0,.3);--btnG:linear-gradient(135deg,#6A2150,#D04A55);--btnSh:rgba(0,0,0,.5);
    --titleG:linear-gradient(90deg,#FF7E95,#FFB27A);--btnLip:#2E0A26;--lip:#09040B;--hi:rgba(255,255,255,.08);--goG:linear-gradient(135deg,#170B20,#3F173A 50%,#8A2C49 85%,#B4523A);}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{background:var(--bg);}
  html,body{margin:0;padding:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
  body{background:var(--pageG);min-height:100vh;}
  h1,.gr{font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif;}
  .wrap{display:flex;flex-direction:column;min-height:100vh;max-width:560px;margin:0 auto;}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--kick);}
  .kicker:before{content:"";width:22px;height:2px;background:var(--kick);border-radius:2px;}
  h1{margin:10px 0 0;font-size:34px;line-height:1.08;font-weight:800;letter-spacing:-.6px;}
  h1 span{display:block;background:var(--titleG);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .lead{margin:12px 0 0;font-size:15px;line-height:1.55;color:var(--muted);max-width:360px;}
  .facts{display:flex;gap:22px;margin-top:18px;}
  .fact{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.3px;}
  .fact b{display:block;font-size:20px;color:var(--ink);font-weight:800;letter-spacing:-.2px;font-family:"Plus Jakarta Sans",Inter,sans-serif;}
  #bpAuthArea{padding-top:22px;}
  .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:inset 0 1px 0 var(--hi),0 4px 0 var(--lip),0 14px 22px -14px rgba(90,30,60,.45);}
  .boxT{font-size:16px;font-weight:700;margin:0 0 6px;}
  .boxP{color:var(--muted);font-size:14px;line-height:1.55;margin:0;}
  .id{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:10px;background:var(--accS);color:var(--accT);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:17px;letter-spacing:1px;user-select:all;-webkit-user-select:all;}
  .inp{width:100%;margin-top:12px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--ink);font-size:16px;outline:none;font-family:inherit;transition:border-color .2s,box-shadow .2s;}
  .inp:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--accS);}
  .btn{width:100%;border:none;border-radius:16px;padding:16px;font-size:16.5px;font-weight:700;cursor:pointer;transition:transform .15s,filter .2s;letter-spacing:.1px;font-family:inherit;position:relative;overflow:hidden;}
  .btn:active{transform:scale(.98);}
  .btnMain{background:var(--btnG);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 0 var(--btnLip),0 14px 26px -12px var(--btnSh);}
  .btnMain:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 1px 0 var(--btnLip);}
  .btnMain:hover{filter:brightness(1.07);}
  .btnMain:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);
    transform:skewX(-18deg);animation:bpShine 5.5s ease-in-out 1.2s infinite;}
  @keyframes bpShine{0%,70%{left:-60%}100%{left:130%}}
  .btnGhost{background:transparent;color:var(--ink);margin-top:10px;padding:12px;font-size:15px;border:1px solid var(--line);}
  .btn[disabled]{opacity:.55;}
  .warn{color:var(--warn);} .note{margin:10px 0;font-size:14px;}
  .trial{display:inline-block;background:var(--accS);color:var(--accT);font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px;margin-bottom:12px;}
  .msg{background:var(--warnS);border-radius:16px;padding:14px 16px;margin-bottom:12px;border:1px solid var(--warnB);}
  .msgL{color:var(--warn);font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;margin:0 0 6px;}
  .msgT{margin:0 0 10px;font-size:15px;line-height:1.5;}
  .msgB{background:var(--acc);color:#fff;border:none;border-radius:999px;padding:8px 18px;font-weight:700;font-size:14px;font-family:inherit;}
  .dev{color:var(--warn);font-size:12px;text-align:center;margin-top:8px;}
  #bpGo{position:fixed;inset:0;z-index:999;background:var(--goG);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .2s ease;}
  #bpGo.on{display:flex;} #bpGo.vis{opacity:1;}
  #bpGo img{width:96px;height:96px;border-radius:24px;box-shadow:0 14px 30px rgba(0,0,0,.4);animation:bpBreath 2.2s ease-in-out infinite;}
  #bpGo .n{margin-top:16px;font-size:18px;font-weight:800;font-family:"Plus Jakarta Sans",Inter,sans-serif;}
  #bpGo .d{margin-top:14px;display:flex;gap:7px;}
  #bpGo .d i{width:8px;height:8px;border-radius:50%;background:#fff;opacity:.25;animation:bpDot 1s infinite ease-in-out;}
  #bpGo .d i:nth-child(2){animation-delay:.15s} #bpGo .d i:nth-child(3){animation-delay:.3s}
  @keyframes bpDot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
  @keyframes bpBreath{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}

  /* A kép kitölti a maradék helyet (első indításkor magától kisebb), lassan közelít (Ken Burns) */
  .hero{position:relative;flex:1 0 auto;min-height:260px;overflow:hidden;}
  .hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 45%;display:block;
    transform-origin:62% 50%;animation:bpKen 28s ease-in-out infinite alternate;}
  @keyframes bpKen{from{transform:scale(1)}to{transform:scale(1.12) translateX(-2%)}}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(var(--heroFade),.05) 0%,rgba(var(--heroFade),0) 35%,rgba(var(--heroFade),.8) 80%,rgb(var(--heroFade)) 100%);}
  .badge{position:absolute;left:22px;top:22px;z-index:3;width:54px;height:54px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,.45);}
  .temaB{position:absolute;right:18px;top:24px;z-index:3;width:42px;height:42px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(10,15,28,.35);
    color:#fff;display:flex;align-items:center;justify-content:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);cursor:pointer;padding:0;}
  .temaB:active{transform:scale(.92);}
  .body{position:relative;margin-top:-90px;z-index:2;padding:0 22px 26px;display:flex;flex-direction:column;flex:0 0 auto;}
  .body>*{animation:bpUp .6s cubic-bezier(.2,.8,.25,1) both;}
  .body>*:nth-child(2){animation-delay:.06s} .body>*:nth-child(3){animation-delay:.12s} .body>*:nth-child(4){animation-delay:.18s} .body>*:nth-child(5){animation-delay:.24s}
  @keyframes bpUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @media (min-width:700px){ .wrap{box-shadow:0 0 60px rgba(60,20,50,.12);} }
  @media (prefers-reduced-motion:reduce){ *,*:before,*:after{animation:none !important;transition:none !important;} }
  .bpVer{margin:18px 0 6px;text-align:center;font-size:12px;letter-spacing:.3px;color:var(--muted);opacity:.7;}
</style>
