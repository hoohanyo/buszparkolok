<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Buszparkolók Európában</title>
<meta name="theme-color" content="#14121C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Buszparkolók">
<style>
  :root{--ink:#F4F1EA;--muted:#B4AEC4;--line:#3A3548;--amber:#FFB020;--coral:#FF6A5A;--pink:#FF5A7A;--warn:#FF9C7A;--bg:#14121C;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Roboto,"Segoe UI",Arial,sans-serif;}
  .wrap{display:flex;flex-direction:column;min-height:100vh;}
  .kicker{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--amber);}
  .kicker:before{content:"";width:22px;height:2px;background:var(--amber);border-radius:2px;}
  h1{margin:10px 0 0;font-size:34px;line-height:1.06;font-weight:900;letter-spacing:-.4px;}
  h1 span{display:block;background:linear-gradient(90deg,#FFB020,#FF6A5A);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .lead{margin:12px 0 0;font-size:15px;line-height:1.55;color:var(--muted);max-width:330px;}
  .facts{display:flex;gap:18px;margin-top:18px;}
  .fact{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.3px;}
  .fact b{display:block;font-size:20px;color:var(--ink);font-weight:900;letter-spacing:0;}
  #bpAuthArea{padding-top:22px;}
  .box{background:#1F1C29;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:inset 0 0 0 1px var(--line),0 3px 0 #0B0A10;}
  .boxT{font-size:16px;font-weight:800;margin:0 0 6px;}
  .boxP{color:var(--muted);font-size:14px;line-height:1.55;margin:0;}
  .id{display:inline-block;margin-top:10px;padding:7px 12px;border-radius:10px;background:#2C2838;color:var(--amber);font-family:monospace;font-size:17px;letter-spacing:1px;user-select:all;-webkit-user-select:all;}
  .inp{width:100%;margin-top:12px;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:#14121C;color:var(--ink);font-size:16px;outline:none;}
  .inp:focus{border-color:var(--amber);}
  .btn{width:100%;border:none;border-radius:16px;padding:16px;font-size:17px;font-weight:900;cursor:pointer;transition:transform .08s,box-shadow .08s;letter-spacing:.2px;}
  .btn:active{transform:translateY(3px);}
  .btnMain{background:linear-gradient(180deg,#FFBE3B,#FF8A3D);color:#2A1500;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 4px 0 #B85A12,0 16px 24px -12px rgba(255,140,40,.6);}
  .btnMain:active{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.45),0 1px 0 #B85A12;}
  .btnGhost{background:transparent;color:var(--ink);margin-top:10px;padding:12px;font-size:15px;box-shadow:inset 0 0 0 1.5px var(--line);}
  .btn[disabled]{opacity:.55;}
  .warn{color:var(--warn);} .note{margin:10px 0;font-size:14px;}
  .trial{display:inline-block;background:rgba(255,176,32,.14);color:var(--amber);font-size:13px;font-weight:800;padding:7px 12px;border-radius:999px;margin-bottom:12px;}
  .msg{background:#2A2418;border-radius:16px;padding:14px 16px;margin-bottom:12px;box-shadow:inset 0 0 0 1px #6B5524;}
  .msgL{color:var(--amber);font-size:12px;font-weight:900;letter-spacing:.5px;text-transform:uppercase;margin:0 0 6px;}
  .msgT{margin:0 0 10px;font-size:15px;line-height:1.5;}
  .msgB{background:var(--amber);color:#2A1500;border:none;border-radius:999px;padding:8px 18px;font-weight:800;font-size:14px;}
  .dev{color:var(--warn);font-size:12px;text-align:center;margin-top:8px;}
  #bpGo{position:fixed;inset:0;z-index:999;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;opacity:0;transition:opacity .18s ease;}
  #bpGo.on{display:flex;} #bpGo.vis{opacity:1;}
  #bpGo img{width:104px;height:104px;border-radius:26px;box-shadow:0 14px 30px rgba(0,0,0,.5);}
  #bpGo .n{margin-top:16px;font-size:18px;font-weight:900;}
  #bpGo .d{margin-top:14px;display:flex;gap:7px;}
  #bpGo .d i{width:8px;height:8px;border-radius:50%;background:var(--amber);opacity:.25;animation:bpDot 1s infinite ease-in-out;}
  #bpGo .d i:nth-child(2){animation-delay:.15s} #bpGo .d i:nth-child(3){animation-delay:.3s}
  @keyframes bpDot{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}

  /* A kép kitölti a maradék helyet: így sehol nincs üres sáv; első indításkor (több tartalom) magától kisebb lesz,
     de 260 px alá nem megy, hogy ne legyen túl szűk. */
  .hero{position:relative;flex:1 0 auto;min-height:260px;overflow:hidden;}
  .hero .ph{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% 45%;display:block;}
  .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,18,28,.15) 0%,rgba(20,18,28,0) 35%,rgba(20,18,28,.75) 78%,#14121C 100%);}
  .badge{position:absolute;left:22px;top:22px;z-index:3;width:54px;height:54px;border-radius:15px;box-shadow:0 8px 20px rgba(0,0,0,.45);}
  .body{position:relative;margin-top:-90px;z-index:2;padding:0 22px 26px;display:flex;flex-direction:column;flex:0 0 auto;}
  .bpVer{margin:18px 0 6px;text-align:center;font-size:12px;letter-spacing:.3px;color:var(--muted);opacity:.7;}
</style>
</head>
